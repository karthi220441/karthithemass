    <style>
        :root {
            --primary: #0F4C75;
            --secondary: #3282B8;
            --accent: #BBE1FA;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --light: #f8f9fa;
            --dark: #212529;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--light);
        }

        .navbar {
            background: var(--primary) !important;
        }

        .form-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            padding: 40px;
            margin-bottom: 30px;
        }

        .map-section {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            padding: 40px;
            height: 600px;
        }

        .map-container {
            height: 100%;
            background: #e9ecef;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        #mapbox-map {
            height: 100%;
            width: 100%;
            border-radius: 10px;
        }

        .coordinates-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .coordinate-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .coordinate-input-group input {
            flex: 1;
        }

        .map-marker {
            background-color: #3282B8;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .location-info {
            background: #e7f3ff;
            border-left: 4px solid #0F4C75;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #0F4C75;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary);
        }

        .btn-submit {
            background: var(--secondary);
            border: none;
            padding: 15px 40px;
            font-weight: 600;
            border-radius: 25px;
            font-size: 1.1rem;
        }

        .btn-submit:hover {
            background: var(--primary);
        }

        .file-upload {
            border: 2px dashed var(--secondary);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload:hover {
            border-color: var(--primary);
            background: var(--accent);
        }

        .file-upload.dragover {
            border-color: var(--primary);
            background: var(--accent);
        }

        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .form-section, .map-section {
                margin-bottom: 20px;
            }

            .map-section {
                height: 400px;
            }

            /* Mobile Navigation */
            .mobile-nav {
                display: block;
            }

            .navbar {
                display: none;
            }
        }

        /* Mobile Navigation */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e9ecef;
            padding: 10px 0;
            z-index: 1000;
            display: none;
        }

        .mobile-nav .nav-item {
            text-align: center;
            flex: 1;
        }

        .mobile-nav .nav-link {
            color: var(--primary);
            font-size: 0.8rem;
            padding: 5px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .mobile-nav .nav-link i {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }

        .mobile-nav .nav-link.active {
            color: var(--secondary);
        }
    </style>
    </style>

    <div class="container-fluid mt-4">
        <div class="row g-4">

            <div class="col-lg-5">

                        <i class="fas fa-plus-circle text-primary me-2"></i>

                    </h2>

                    <form id="complaintForm">
                        <div class="mb-3">

                            <input type="text" class="form-control" id="title" placeholder="e.g., Lake Encroachment at XYZ" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description *</label>
                            <textarea class="form-control" id="description" rows="4" placeholder="Describe the encroachment or environmental violation..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="district" class="form-label">District *</label>
                            <select class="form-control" id="district" required>
                                <option value="">Select District</option>
                                <option value="Ariyalur">Ariyalur</option>
                                <option value="Chennai">Chennai</option>
                                <option value="Coimbatore">Coimbatore</option>
                                <option value="Cuddalore">Cuddalore</option>
                                <option value="Dharmapuri">Dharmapuri</option>
                                <option value="Dindigul">Dindigul</option>
                                <option value="Erode">Erode</option>
                                <option value="Kallakurichi">Kallakurichi</option>
                                <option value="Kancheepuram">Kancheepuram</option>
                                <option value="Karur">Karur</option>
                                <option value="Krishnagiri">Krishnagiri</option>
                                <option value="Madurai">Madurai</option>
                                <option value="Nagapattinam">Nagapattinam</option>
                                <option value="Namakkal">Namakkal</option>
                                <option value="Nilgiris">Nilgiris</option>
                                <option value="Perambalur">Perambalur</option>
                                <option value="Pudukkottai">Pudukkottai</option>
                                <option value="Ramanathapuram">Ramanathapuram</option>
                                <option value="Ranipet">Ranipet</option>
                                <option value="Salem">Salem</option>
                                <option value="Sivaganga">Sivaganga</option>
                                <option value="Tenkasi">Tenkasi</option>
                                <option value="Thanjavur">Thanjavur</option>
                                <option value="Theni">Theni</option>
                                <option value="Thoothukudi">Thoothukudi</option>
                                <option value="Tiruchirappalli">Tiruchirappalli</option>
                                <option value="Tirunelveli">Tirunelveli</option>
                                <option value="Tirupathur">Tirupathur</option>
                                <option value="Tiruppur">Tiruppur</option>
                                <option value="Tiruvallur">Tiruvallur</option>
                                <option value="Tiruvannamalai">Tiruvannamalai</option>
                                <option value="Tiruvarur">Tiruvarur</option>
                                <option value="Vellore">Vellore</option>
                                <option value="Viluppuram">Viluppuram</option>
                                <option value="Virudhunagar">Virudhunagar</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Location *</label>
                            <input type="text" class="form-control" id="location" placeholder="Click on map to set location or enter coordinates" readonly>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Coordinates (Optional)</label>
                            <div class="coordinate-input-group">
                                <input type="number" class="form-control" id="latitude" placeholder="Latitude" step="0.000001">
                                <input type="number" class="form-control" id="longitude" placeholder="Longitude" step="0.000001">
                            </div>
                            <small class="text-muted">Enter coordinates or click on the map to set them automatically</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Photo Evidence *</label>
                            <div class="file-upload" id="fileUpload">

                                <p class="text-muted">or <span class="text-primary" style="cursor: pointer;" onclick="document.getElementById('image').click()">browse files</span></p>
                                <input type="file" id="image" accept="image/*" style="display: none;" required>
                            </div>

            <!-- Map Section -->
            <div class="col-lg-7">
                <div class="map-section">
                    <h3 class="mb-4">
                        <i class="fas fa-map-marked-alt text-primary me-2"></i>
                        Select Location
                    </h3>
                    <div class="map-container">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('complaintForm');
        const fileUpload = document.getElementById('fileUpload');
        const imageInput = document.getElementById('image');
        const imagePreview = document.getElementById('imagePreview');
        
        // Initialize Leaflet map centered on Tamil Nadu (NO API KEY NEEDED)
        const map = L.map('mapbox-map').setView([11.1271, 78.6569], 8);
        
        // Add OpenStreetMap tiles (free)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);
        
        // Add marker to track selected location
        let marker;
        
        // Map click event
        map.on('click', (e) => {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            // Update latitude and longitude fields
            document.getElementById('latitude').value = lat.toFixed(6);
            document.getElementById('longitude').value = lng.toFixed(6);
            
            // Remove previous marker if exists
            if (marker) {
                map.removeLayer(marker);
            }
            
            // Create new marker at clicked location
            marker = L.marker([lat, lng])
                .bindPopup(`<b>Location Selected</b><br>Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}`)
                .addTo(map)
                .openPopup();
            
            // Get address from coordinates (reverse geocoding)
            getAddressFromCoordinates(lat, lng);
        });
        
        // Reverse geocoding function (FREE - uses OpenStreetMap Nominatim)
        async function getAddressFromCoordinates(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await response.json();
                const address = data.address;
                
                // Build a nice address display
                let locationDisplay = `${address.road || address.village || address.city_district || ''}, ${address.city || address.town || ''}, ${address.state || ''} ${address.postcode || ''}`.trim();
                
                // Fallback if no address found
                if (!locationDisplay || locationDisplay === ',') {
                    locationDisplay = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
                }
                
                // Update location field
                document.getElementById('location').value = locationDisplay;
            } catch (error) {
                console.error('Error getting address:', error);
                // Fallback to coordinates if geocoding fails
                document.getElementById('location').value = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
            }
        }
        
        // Handle manual latitude/longitude input
        document.getElementById('latitude').addEventListener('change', updateMarkerFromCoordinates);
        document.getElementById('longitude').addEventListener('change', updateMarkerFromCoordinates);
        
        function updateMarkerFromCoordinates() {
            const lat = parseFloat(document.getElementById('latitude').value);
            const lng = parseFloat(document.getElementById('longitude').value);
            
            if (!isNaN(lat) && !isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                // Remove previous marker
                if (marker) {
                    map.removeLayer(marker);
                }
                
                // Create marker at coordinates
                marker = L.marker([lat, lng])
                    .bindPopup(`<b>Location</b><br>Lat: ${lat.toFixed(6)}<br>Lng: ${lng.toFixed(6)}`)
                    .addTo(map)
                    .openPopup();
                
                // Center map on coordinates
                map.setView([lat, lng], 13);
                
                // Get address from coordinates (reverse geocoding)
                getAddressFromCoordinates(lat, lng);
            }
        }

        // File upload handling
        fileUpload.addEventListener('click', () => {
            imageInput.click();
        });

        fileUpload.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUpload.classList.add('dragover');
        });

        fileUpload.addEventListener('dragleave', () => {
            fileUpload.classList.remove('dragover');
        });

        fileUpload.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUpload.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                imageInput.files = files;
                handleFileSelect();
            }
        });

        imageInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = imageInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const latitude = document.getElementById('latitude').value;
            const longitude = document.getElementById('longitude').value;
            
            if (!latitude || !longitude) {
                alert('Please select a location on the map or enter coordinates');
                return;
            }

            const formData = new FormData();
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('district', document.getElementById('district').value);
            formData.append('location', document.getElementById('location').value);
            formData.append('latitude', latitude);
            formData.append('longitude', longitude);

            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch('/api/complaints', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('Complaint submitted successfully!');
                    form.reset();
                    imagePreview.style.display = 'none';
                    if (marker) marker.remove();
                    document.getElementById('location').value = '';
                } else {
                    alert('Error submitting complaint. Please try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting complaint. Please check your connection.');
            }
        });
    </script>
